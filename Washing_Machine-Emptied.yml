alias: Washing Machine - Emptied
description: >-
  Automatically acknowledges finished laundry when the washing machine door is
  opened after a completed wash or dry cycle. Opening the door while loading an
  idle machine does not count as emptying it.
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.washing_machine_door
    from: 'off'
    to: 'on'
conditions:
  - alias: Finished laundry is waiting
    note: >-
      washing_machine_notified is turned off when a cycle finishes and remains
      off until the laundry has been acknowledged. This prevents ordinary door
      openings while loading the machine from being treated as emptying it.
    condition: state
    entity_id: input_boolean.washing_machine_notified
    state: 'off'
  - alias: Washing machine has a completed cycle
    note: >-
      Accept either finished washing or finished drying. Do not depend on the
      LocalThings progress entity still being in finish because the washer
      automatically returns to idle later even when the laundry has not been
      removed.
    condition: template
    value_template: |-
      {{
        states('input_text.washing_machine_status')
        in ['finished washing', 'finished drying']
      }}
actions:
  - alias: Record when laundry was emptied
    note: >-
      Store the actual door-open acknowledgement time so it can later be
      compared with washing_machine_finished.
    action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.washing_machine_acknowledged
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  - alias: Mark washing machine as emptied
    action: input_text.set_value
    target:
      entity_id: input_text.washing_machine_status
    data:
      value: emptied
  - alias: Mark finished laundry as acknowledged
    note: >-
      The periodic reminder treats washing_machine_notified being off as laundry
      still requiring attention. Turning it on stops further reminders.
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.washing_machine_notified
mode: single
